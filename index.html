<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 页面主内容：个人信息名片 -->
    <main class="business-card">
        <!-- 头像区域，使用占位图片便于直接替换 -->
        <img
            class="avatar"
            src="https://i.pravatar.cc/240?img=12"
            alt="林默的头像"
        >

        <!-- 个人基本信息 -->
        <h1>林默</h1>
        <p class="job-title">产品设计师</p>

        <!-- 联系方式列表 -->
        <div class="contact-list" aria-label="联系方式">
            <a href="mailto:linmo@example.com">
                <span class="contact-label">邮箱</span>
                <span>linmo@example.com</span>
            </a>
            <a href="tel:+8613800138000">
                <span class="contact-label">电话</span>
                <span>+86 138 0013 8000</span>
            </a>
            <a href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer">
                <span class="contact-label">主页</span>
                <span>linkedin.com/in/linmo</span>
            </a>
        </div>
    </main>
</body>
</html>
